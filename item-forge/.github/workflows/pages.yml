# Публикация Кузницы предметов на GitHub Pages.
# Как включить: репозиторий → Settings → Pages → Source: "GitHub Actions".
# Сайт: https://rpg-companios.github.io/fallout2d20forge/ — базовый путь
# сборки берётся из имени репозитория (VITE_BASE).

name: Deploy to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Test (round-trip + целостность слепка справочников)
        run: npm test

      - name: Build (с базовым путём проектной страницы)
        run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
