<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>Positronium</title>
    <meta name="description" content="Positronium — a tabletop RPG character manager: create, store, edit, import/export, and sync characters to the cloud. Currently running the Fallout 2d20 setting." />
    <meta name="theme-color" content="#1b1b1b" />
    <meta name="mobile-web-app-title" content="Positronium" />
    <meta name="apple-mobile-web-app-title" content="Positronium" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/favicon.ico" />
    <script>
      // Google Drive sync (components/cloudSync/googleDriveSync.js) reads this
      // Client ID at runtime. For a static/PWA build we set it here so the same
      // exported bundle works on every host (replit.app, na4u.ru, ...).
      // OAuth client ID is public (used in the browser token flow); it is NOT a secret.
      window.FALLOUT_GOOGLE_DRIVE_CLIENT_ID = '808936097288-fdmd1ds0q3n5i1rs4ssku4foqonvqfgj.apps.googleusercontent.com';
    </script>
    <script>
      // Store the install prompt globally so React can pick it up even if it fires
      // before the JS bundle finishes loading.
      window.__pwaInstallPrompt = null;

      window.addEventListener('beforeinstallprompt', (event) => {
        // 396: НЕ вызываем event.preventDefault(). Раньше мы глушили родной
        // диалог браузера, оставляя установку только через нашу кнопку —
        // а в части браузеров (сегодняшний Яндекс) отложенный prompt()
        // своего UI не поднимает, и диалог не показывался ВООБЩЕ. Теперь
        // браузер волен показать свой родной путь установки; событие лишь
        // запоминаем — для диагностики и кнопки.
        window.__pwaInstallPrompt = event;
        // Notify React if it is already listening
        window.dispatchEvent(new CustomEvent('pwaInstallPromptReady', { detail: event }));
      });

      window.addEventListener('appinstalled', () => {
        window.__pwaInstallPrompt = null;
        window.dispatchEvent(new CustomEvent('pwaInstalled'));
      });

    </script>
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
        margin: 0;
        background-color: #121212;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
      @keyframes positronium-spin {
        to { transform: rotate(360deg); }
      }
      .positronium-preboot {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #121212;
        color: #f0e68c;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        padding: 24px;
        text-align: center;
      }
      .positronium-preboot-ring {
        width: 38px;
        height: 38px;
        border: 3px solid rgba(240, 230, 140, 0.2);
        border-top-color: #f0e68c;
        border-radius: 50%;
        animation: positronium-spin 0.9s linear infinite;
        margin-bottom: 16px;
      }
      .positronium-preboot-title {
        font-size: 18px;
        font-weight: 700;
        letter-spacing: 0.6px;
        margin-bottom: 6px;
      }
      .positronium-preboot-sub {
        font-size: 13px;
        color: #9ca3af;
      }
      .positronium-preboot-err {
        display: none;
        margin-top: 14px;
        max-width: 360px;
        padding: 10px 14px;
        border-radius: 8px;
        background: rgba(220, 38, 38, 0.16);
        border: 1px solid rgba(248, 113, 113, 0.4);
        color: #fca5a5;
        font-size: 12px;
      }
      .positronium-preboot-btn {
        display: none;
        margin-top: 12px;
        padding: 9px 18px;
        border: 0;
        border-radius: 8px;
        background: #d4af37;
        color: #111827;
        font-size: 13px;
        font-weight: 700;
        cursor: pointer;
      }
    </style>
  </head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <!-- The root element for your Expo app (мгновенный индикатор до старта React, заменяется автоматически при монтировании). -->
    <div id="root">
      <div class="positronium-preboot" id="positronium-preboot">
        <div class="positronium-preboot-ring" id="positronium-preboot-ring"></div>
        <div class="positronium-preboot-title">Positronium</div>
        <div class="positronium-preboot-sub" id="positronium-preboot-sub">Загрузка интерфейса…</div>
        <div class="positronium-preboot-err" id="positronium-preboot-err"></div>
        <button class="positronium-preboot-btn" id="positronium-preboot-btn" onclick="location.reload()">Обновить страницу</button>
      </div>
    </div>
    <script>
      (function () {
        var t0 = Date.now();
        var timer = setInterval(function () {
          var sub = document.getElementById('positronium-preboot-sub');
          if (!sub) { clearInterval(timer); return; }
          var sec = Math.floor((Date.now() - t0) / 1000);
          if (sec >= 2) {
            sub.textContent = 'Загрузка модулей приложения… ' + sec + ' сек';
          }
        }, 1000);
        window.addEventListener('error', function (ev) {
          var errBox = document.getElementById('positronium-preboot-err');
          var btn = document.getElementById('positronium-preboot-btn');
          var ring = document.getElementById('positronium-preboot-ring');
          if (!errBox) return;
          if (ev && ev.target && ev.target.tagName === 'SCRIPT') {
            if (ring) ring.style.display = 'none';
            errBox.style.display = 'block';
            errBox.textContent = 'Не удалось загрузить скрипт приложения. Возможно, сервер перезапускается.';
            if (btn) btn.style.display = 'inline-block';
          }
        }, true);
      })();
    </script>
  </body>
</html>
